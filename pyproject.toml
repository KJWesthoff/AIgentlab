[project]
name = "agentlab"
version = "0.1.0"
description = "Model-agnostic multi-agent lab: hosted models behind a provider-neutral interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "fastembed>=0.4",
]

[project.scripts]
agentlab = "agentlab.main:main"
agentlab-graph = "agentlab.graph.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentlab.observability" = ["viewer.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
